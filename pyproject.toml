[project]
name = "agemem"
version = "0.1.0"
readme = "README.md"
description = "Project memory: git-tracked working state, jev-mem decisions, and original evidence"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7", "numpy>=2.4,<3", "fastembed>=0.8.1,<1", "mcp>=2,<3", "typesafe-sdk>=0.7.2,<1"]

# Optional QSIV GPU dependencies are installed into a separate environment by
# `agemem provider setup qsiv`, using agemem/data/qsiv-linux-py312.lock.
[project.optional-dependencies]
raw = ["tiktoken>=0.8,<1"]
compatibility = ["jevmem==0.4.0"] # Only for upstream database compatibility tests.

[project.scripts]
agemem = "agemem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agemem"]

[tool.hatch.build.targets.sdist]
include = ["/agemem", "/pyproject.toml", "/README.md", "/THIRD_PARTY.md"]
