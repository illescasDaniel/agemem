[project]
name = "agemem"
version = "0.1.0"
description = "Project memory: git-tracked working state, jev-mem decisions, and original evidence"
requires-python = ">=3.12"
dependencies = ["jevmem==0.4.0", "fastembed>=0.7,<1"]

[project.optional-dependencies]
dense = ["fastembed>=0.7,<1"]
upstream = ["openai>=1,<4", "rich>=13,<16", "tqdm>=4,<5", "PyYAML>=6,<7", "tiktoken>=0.8,<1"]
jev = ["jevmem==0.4.0"]

[project.scripts]
amem = "amem_lab.cli:main"
agemem = "agemem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agemem", "amem_lab"]
